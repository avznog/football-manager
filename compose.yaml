# An optional, self-contained way to run the whole stack: Postgres 17 and the built app.
#
# It does not replace `npm run dev` against the Homebrew Postgres — that is still the documented
# development loop (decisions 016 and 077). Use this when you want the app running the way it runs
# in production, or on a machine with no Homebrew.
#
#   docker compose up -d db        # Postgres only, for `npm run dev` on the host
#   docker compose run --rm migrate
#   docker compose up --build app  # the production image on http://localhost:3000
#
# The credentials are the ones CI and `.env.example` already use, so nothing else has to change.
#
# **`up` leaves a schema with no accounts.** `db`, `migrate` and `app` are all it starts; the two
# services that create users are in the `setup` profile and are never started for you, so
# `select username from users` returns nothing and there is no password that logs you in. Neither
# `admin`/`admin` nor `admin`/`change-me` works — see the two services below. Pick one way out:
#
#   docker compose run --rm seed       # the demo season: `admin`/`change-me`, players on `motdepasse`
#   SUPER_ADMIN_USERNAME=admin SUPER_ADMIN_PASSWORD='…' docker compose run --rm bootstrap
#                                      # reference data and one real super admin, no demo data

name: football-manager

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: football
      POSTGRES_PASSWORD: football
      POSTGRES_DB: football_manager
    ports:
      # Published so `npm run dev`, `db:studio` and the Playwright suite on the host can reach it.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Without a healthcheck the first migration races the server's own start-up, exactly as in
      # `.github/workflows/ci.yml`. `-d`/`-U` so it probes the real database, not the default one.
      test: ["CMD-SHELL", "pg_isready -U football -d football_manager"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: applies the committed migrations, never `db:push`. Run it before `app`, and again
  # after pulling a schema change.
  migrate:
    build:
      context: .
      target: tools
    environment:
      DATABASE_URL: postgres://football:football@db:5432/football_manager
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    command: ["npm", "run", "db:migrate"]

  # Reference data and the one super admin, for an empty database — docs/DEPLOY.md §3.
  # Not started by `up`, and that is why a freshly `up`ped stack has no account at all:
  # `docker compose run --rm bootstrap`, with a password you choose. `change-me` is *refused* by
  # `db/bootstrap.ts` — it blacklists the demo password and enforces a minimum length, so `admin`
  # is refused too (decision 052). This service creates no team and no demo data.
  bootstrap:
    profiles: ["setup"]
    build:
      context: .
      target: tools
    environment:
      DATABASE_URL: postgres://football:football@db:5432/football_manager
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-admin}
      # Left empty rather than defaulted, and rather than `:?` — a required-variable check here
      # would make plain `docker compose up` fail for a service it does not even start. The script
      # itself refuses an absent, short or demo password (decision 052).
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    command: ["npm", "run", "db:bootstrap"]

  # The demo season — the other way out of a stack you cannot log into. It creates `admin` /
  # `change-me` and a squad on `motdepasse`, plus a season of matches, trainings and events, so a
  # local stack can be clicked through end to end instead of merely being reachable.
  #
  # Built from `tools`, which sets no `NODE_ENV`: `db/seed.ts` refuses to run under
  # `NODE_ENV=production`, and that guard is what keeps demo passwords off a real database. It is
  # not weakened here and must not be — this service is for the compose database and nothing else.
  # Pointing it at Neon, or at any database anyone else uses, would hand out known passwords.
  seed:
    profiles: ["setup"]
    build:
      context: .
      target: tools
    environment:
      DATABASE_URL: postgres://football:football@db:5432/football_manager
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    command: ["npm", "run", "db:seed"]

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://football:football@db:5432/football_manager
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
